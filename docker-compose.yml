services:
  # Vector store: there is no local Qdrant service. api and celery_worker
  # connect to the Qdrant Cloud cluster named by QDRANT_URL + QDRANT_API_KEY,
  # which they read from .env via env_file (CLAUDE.md §20). One shared
  # collection; every point carries a repo_id payload field that searches
  # filter on.

  # Redis: there is no local Redis service either. The Celery broker + result
  # backend and the shared RedisStatusStore use the Redis Cloud database named
  # by REDIS_URL / CELERY_BROKER_URL / CELERY_RESULT_BACKEND in .env (read via
  # env_file). The answer cache (exact + semantic) is Redis LangCache, reached
  # through its API (LANGCACHE_* in .env).

  # FastAPI app: POST /api/repos, GET /api/repos/{id}, POST /api/repos/{id}/chat.
  # Enqueues ingestion onto Celery instead of running it inline — see
  # src/api/dependencies.py (RagWorkflowFacade.enqueue_ingestion).
  api:
    build: .
    image: codebase-rag-backend:latest
    ports:
      - "8000:8000"
    env_file: .env
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  # Celery worker(s): runs ingest_repo_task (src/worker/tasks.py) — the
  # clone -> chunk -> embed -> store pipeline — off the API process, so a
  # slow/large ingestion never blocks other users' requests. Scale with
  # `docker-compose up --scale celery_worker=N` for more ingestion throughput.
  celery_worker:
    build: .
    image: codebase-rag-backend:latest
    env_file: .env
    command: celery -A worker.celery_app worker --pool=solo --without-gossip --without-mingle --loglevel=debug
    restart: unless-stopped

  # React/TS SPA (src/frontend/), built and served by nginx. VITE_API_BASE_URL
  # is compiled into the JS bundle at image-build time (Vite inlines
  # import.meta.env.* — it is NOT read at container start), so it must be the
  # URL your browser can reach, not the internal "api" service name. Default
  # below matches the api service's host port mapping (8000:8000).
  frontend:
    build:
      context: ./src/frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
