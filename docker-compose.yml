services:
  # ChromaDB vector store - persistent HTTP server
  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    restart: unless-stopped

  # Step 1: AST-chunk the target repository
  # Set HOST_REPO_PATH in .env to the local path of the repo you want to index
  chunk:
    build: .
    volumes:
      - ./src/data:/app/src/data
      - ${HOST_REPO_PATH}:/repo:ro
    env_file: .env
    environment:
      REPO_PATH: /repo
      CHUNKS_JSON_PATH: /app/src/data/chunks/code_chunks.jsonl
    command: python -m chunking.chunk_main

  # Step 2: Embed chunks and store in ChromaDB
  embed:
    build: .
    volumes:
      - ./src/data:/app/src/data
    env_file: .env
    environment:
      CHUNKS_JSON_PATH: /app/src/data/chunks/code_chunks.jsonl
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    depends_on:
      - chroma
    command: python -m embeddings.embeddings_main

  # Step 3: Run the ADK agent web server
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    depends_on:
      - chroma
    restart: unless-stopped

volumes:
  chroma_data:
